<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D try-on</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #172421;
        color: white;
        font: 14px Arial;
      }
      #JeelizVTOWidget {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
        text-align: center;
      }
      button {
        position: absolute;
        top: 18px;
        left: 18px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
      }
      #JeelizVTOWidgetAdjustNotice {
        display: none;
        position: absolute;
        top: 65px;
        left: 18px;
      }
      #JeelizVTOWidgetAdjustExit {
        position: static;
      }
    </style>
    <script src="/jeeliz/JeelizVTOWidget.js"></script>
  </head>
  <body>
    <div id="JeelizVTOWidget">
      <canvas id="JeelizVTOWidgetCanvas"></canvas
      ><button id="JeelizVTOWidgetAdjust">Adjust fit</button>
      <div id="JeelizVTOWidgetAdjustNotice">
        Drag glasses to adjust.<button id="JeelizVTOWidgetAdjustExit">
          Done
        </button>
      </div>
      <div id="status" role="status">Starting camera…</div>
    </div>
    <script>
      const status = document.getElementById("status");
      JEELIZVTOWIDGET.start({
        sku: new URLSearchParams(location.search).get("sku"),
        searchImageMask: "/jeeliz/target512.jpg",
        callbacks: {
          LOADING_START: () => (status.textContent = "Loading glasses…"),
          LOADING_END: () => (status.textContent = "Look at the camera."),
        },
        callbackReady: () => (status.textContent = "Look at the camera."),
        onError: (code) =>
          (status.textContent =
            code === "WEBCAM_UNAVAILABLE"
              ? "Allow camera access and try again."
              : "Try-on failed (" + code + ")."),
      }).catch(
        () =>
          (status.textContent =
            "Could not start camera. Check camera permissions and WebGL."),
      );
      window.addEventListener("pagehide", () => JEELIZVTOWIDGET.destroy());
    </script>
  </body>
</html>
